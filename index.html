<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Buddy 🎬</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>🎬 Movie Buddy</h1>
      <p>Your friendly movie recommendation chatbot</p>
    </div>

    <div class="chat-window" id="chatWindow">
      <div class="message bot">
        Hi there! Tell me a movie you like, and I'll recommend similar ones 🍿
      </div>
    </div>

    <form id="chatForm" class="chat-input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Type a movie title... e.g. Inception"
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const TMDB_API_KEY = "53b6620507a7b71ecbc37dc73259c1cd";
    const TMDB_BASE = "https://api.themoviedb.org/3";

    const chatWindow = document.getElementById('chatWindow');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.innerText = text;
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return msg;
    }

    function addRecommendations(introText, recs) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('message', 'bot');

      const intro = document.createElement('div');
      intro.innerText = introText;
      wrapper.appendChild(intro);

      if (recs && recs.length) {
        const list = document.createElement('ul');
        list.classList.add('rec-list');
        recs.forEach(title => {
          const li = document.createElement('li');
          li.innerText = title;
          list.appendChild(li);
        });
        wrapper.appendChild(list);
      }

      chatWindow.appendChild(wrapper);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }


    async function searchMovie(query) {
      const url = `${TMDB_BASE}/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`;
      const resp = await fetch(url);
      const data = await resp.json();
      const results = data.results || [];
      return results.length ? results[0] : null;
    }


    async function getRecommendations(movieId, n = 5) {
      const url = `${TMDB_BASE}/movie/${movieId}/recommendations?api_key=${TMDB_API_KEY}`;
      const resp = await fetch(url);
      const data = await resp.json();
      const results = data.results || [];
      return results.slice(0, n).map(m => m.title);
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = userInput.value.trim();
      if (!query) return;

      addMessage(query, 'user');
      userInput.value = '';

      const typing = addMessage('Thinking...', 'bot typing');

      try {
        const movie = await searchMovie(query);

        if (!movie) {
          typing.remove();
          addMessage(`I couldn't find '${query}' on TMDB. Try a different title!`, 'bot');
          return;
        }

        const title = movie.title;
        const recs = await getRecommendations(movie.id);

        typing.remove();

        if (!recs.length) {
          addMessage("Hmm... TMDB doesn't have recommendations for that one.", 'bot');
          return;
        }

        addRecommendations(`Because you mentioned '${title}', you might also enjoy:`, recs);
      } catch (err) {
        typing.remove();
        addMessage('⚠️ Something went wrong reaching TMDB. Please try again.', 'bot');
      }
    });
  </script>

</body>
</html>
