<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Buddy — Movie Recommendation Chat (TMDB)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="lobby">

  <header class="marquee">
    <div class="marquee__bulbs" aria-hidden="true"></div>
    <h1 class="marquee__title">REEL&nbsp;BUDDY</h1>
    <p class="marquee__subtitle">Live movie recommendations powered by TMDB</p>
  </header>

  <main class="ticket">
    <div class="ticket__perf ticket__perf--left" aria-hidden="true"></div>

    <div class="ticket__stub">
      <div class="stub-row">
        <span class="stub-label">ADMIT</span>
        <span class="stub-value">ONE</span>
      </div>
      <div class="stub-row">
        <span class="stub-label">SOURCE</span>
        <span class="stub-value">TMDB · LIVE</span>
      </div>
      <div class="stub-row">
        <span class="stub-label">STATUS</span>
        <span class="stub-value" id="api-status">Not connected</span>
      </div>

      <div class="api-box">
        <label for="api-key-input">TMDB API Key (v3 auth)</label>
        <input type="password" id="api-key-input" placeholder="Paste your key…" autocomplete="off">
        <button id="save-key-btn" type="button">Save Key</button>
        <a class="api-help" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">Get a free key ↗</a>
      </div>
    </div>

    <div class="ticket__screen">
      <div class="chat" id="chat" aria-live="polite"></div>

      <form class="composer" id="composer">
        <input
          type="text"
          id="user-input"
          placeholder="Tell me a movie you like… (e.g. Inception)"
          autocomplete="off"
        >
        <button type="submit" aria-label="Send">SEND</button>
      </form>
    </div>
  </main>

  <footer class="credits">
    Pure HTML · CSS · JavaScript — talks directly to the TMDB API from your browser.
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
